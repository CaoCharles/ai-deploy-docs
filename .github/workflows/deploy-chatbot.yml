name: Test and Deploy Chatbot to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".python-version"
      - ".github/workflows/deploy-chatbot.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".python-version"
      - ".github/workflows/deploy-chatbot.yml"
  workflow_dispatch:

env:
  SERVICE_NAME: ai-deploy-docs-chatbot
  REGION: asia-east1
  CONTENT_URL: https://caocharles.github.io/ai-deploy-docs/content.json
  GEMINI_SECRET_NAME: ai-deploy-docs-gemini-api-key

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Set up Python
        run: uv python install "$(cat .python-version)"

      - name: Install locked backend dependencies
        run: uv sync --project backend --locked

      - name: Run backend tests
        run: uv run --project backend pytest -q backend/tests

  deploy:
    if: github.event_name != 'pull_request' && vars.GCP_PROJECT_ID != ''
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate GCP identity configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SA }}
          BUILD_SA: ${{ vars.GCP_BUILD_SA }}
        run: |
          set -euo pipefail

          account_project() {
            local account="${1##*/}"
            local domain="${account#*@}"
            printf '%s' "${domain%.iam.gserviceaccount.com}"
          }

          deployer_project="$(account_project "${DEPLOYER_SA}")"
          runtime_project="$(account_project "${RUNTIME_SA}")"
          if [[ "${BUILD_SA}" == projects/*/serviceAccounts/* ]]; then
            build_project="$(cut -d/ -f2 <<<"${BUILD_SA}")"
          else
            build_project="$(account_project "${BUILD_SA}")"
          fi

          test "${PROJECT_ID}" = "${deployer_project}"
          test "${PROJECT_ID}" = "${runtime_project}"
          test "${PROJECT_ID}" = "${build_project}"

          project_number="$(gcloud projects describe "${PROJECT_ID}" --format='value(projectNumber)')"
          provider_project_number="$(cut -d/ -f2 <<<"${WIF_PROVIDER}")"
          test "${project_number}" = "${provider_project_number}"

      # One-time migration only. Remove this step after the first successful run.
      - name: Migrate Gemini key to Secret Manager when empty
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          enabled_versions="$(gcloud secrets versions list "${{ env.GEMINI_SECRET_NAME }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --filter='state=ENABLED' \
            --format='value(name)' | awk 'NF {count++} END {print count+0}')"

          if [[ "${enabled_versions}" -eq 0 ]]; then
            test -n "${GEMINI_API_KEY}"
            printf '%s' "${GEMINI_API_KEY}" | gcloud secrets versions add "${{ env.GEMINI_SECRET_NAME }}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --data-file=- \
              --quiet >/dev/null
          fi

      - name: Deploy public chatbot API
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --source backend \
            --region "${{ env.REGION }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --service-account "${{ vars.GCP_RUNTIME_SA }}" \
            --build-service-account "${{ vars.GCP_BUILD_SA }}" \
            --update-env-vars "CONTENT_URL=${{ env.CONTENT_URL }},DOCUMENT_CACHE_SECONDS=3600" \
            --update-secrets "GEMINI_API_KEY=${{ env.GEMINI_SECRET_NAME }}:latest" \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 10 \
            --max-instances 3 \
            --timeout 90 \
            --quiet

      - name: Verify deployed service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          service_json="$(gcloud run services describe "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${PROJECT_ID}" \
            --format json)"

          jq -e '.status.conditions[] | select(.type == "Ready") | .status == "True"' \
            <<<"${service_json}" >/dev/null
          jq -e '[.spec.template.spec.containers[0].env[]? | select(.name == "GEMINI_API_KEY")][0]
            | has("valueFrom") or has("valueSource")' <<<"${service_json}" >/dev/null

          policy_json="$(gcloud run services get-iam-policy "${{ env.SERVICE_NAME }}" \
            --region "${{ env.REGION }}" \
            --project "${PROJECT_ID}" \
            --format json)"
          jq -e 'any(.bindings[]?; .role == "roles/run.invoker"
            and (.members | index("allUsers") != null))' <<<"${policy_json}" >/dev/null

          service_url="$(jq -r '.status.url' <<<"${service_json}")"
          curl --fail --silent --show-error "${service_url}/" >/dev/null

          cors_headers="$(curl --silent --show-error --dump-header - --output /dev/null \
            --request OPTIONS "${service_url}/api/chat" \
            --header 'Origin: https://caocharles.github.io' \
            --header 'Access-Control-Request-Method: POST')"
          grep -Eiq '^access-control-allow-origin: https://caocharles.github.io\r?$' \
            <<<"${cors_headers}"

          chat_response="$(curl --fail --silent --show-error "${service_url}/api/chat" \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://caocharles.github.io' \
            --data '{"history":[],"message":"Cloud Run 的 Revision 是什麼？請用一句話回答並附上本站文件連結。","session_id":"deployment-smoke-test"}')"
          jq -e '.text | type == "string" and length >= 20
            and contains("caocharles.github.io/ai-deploy-docs/")' \
            <<<"${chat_response}" >/dev/null
