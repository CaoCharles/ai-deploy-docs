site_name: 雲端架構與 API 部署筆記
site_description: 從 HTTP API、Python Web Server 與 Container，到 GitHub Actions、Cloud Run、負載測試與雲端模型容量規劃
site_author: Charles Cao
site_url: https://caocharles.github.io/ai-deploy-docs/
copyright: Copyright &copy; 2026 Charles Cao - 筆記製作者

hooks:
  - hooks/generate_content.py

theme:
  name: material
  language: zh-TW
  custom_dir: overrides
  icon:
    logo: material/cloud-outline
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: 切換至深色模式
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: 切換至淺色模式
  font:
    text: Noto Sans TC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

plugins:
  - search:
      lang: zh
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: true
      exclude:
        - index.md
      fallback_to_build_date: true
      locale: zh_TW
      timezone: Asia/Taipei
      type: iso_date
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_css:
  - assets/stylesheets/extra.css
  - assets/css/chatbot.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.17.0/dist/mermaid.min.js
  - https://cdn.jsdelivr.net/npm/marked/marked.min.js
  - https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js
  - assets/js/chatbot-config.js
  - assets/js/chatbot.js

nav:
  - 首頁: index.md
  - API 與後端服務:
      - API 與後端技術地圖: api_overview.md
      - HTTP Request、GET、POST 與 REST API: http_get_post_rest_api.md
      - REST API 設計案例: api_design_case.md
      - Flask、FastAPI、Gunicorn 與 Uvicorn: flask_fastapi_gunicorn_uvicorn.md
      - Gunicorn 與 Uvicorn 架構案例: server_architecture_case.md
  - CI/CD 與交付:
      - CI/CD 學習路徑: cicd_overview.md
      - GitHub Actions 到 Cloud Run: github_actions_cloud_run_deployment.md
      - Docker Image 與 Artifact Registry: docker_artifact_registry.md
  - Cloud Run:
      - Cloud Run 學習路徑: cloud_run_overview.md
      - Service、Revision、Instance 與擴縮: cloud_run_core_concepts.md
      - 環境變數、Secrets 與 Secret Manager: configuration_and_secrets.md
  - 效能與容量:
      - 效能測試學習路徑: performance_overview.md
      - JMeter、TPS、延遲與壓力測試: jmeter_load_testing.md
      - Azure OpenAI 的 TPM、RPM 與 429: azure_openai_quota.md
  - 實際架構案例:
      - 雲端 API 系統邊界與部署流程: system_boundaries_and_deployment_flow.md
      - 一次 API 請求如何流動: runtime_request_flow.md
