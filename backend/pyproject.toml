[project]
name = "ai-deploy-docs-chatbot"
version = "0.1.0"
description = "Gemini-powered AI assistant backend for ai-deploy-docs"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.116.0",
    "google-genai==2.18.1",
    "numpy>=2.0.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
]

